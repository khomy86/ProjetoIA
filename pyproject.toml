[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-prices"
version = "1.0.0"
description = "Previsão de preços de voos com Regressão Linear, Random Forest e XGBoost"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.60",
    "jupyter",
]

[project.scripts]
filter-itineraries = "flight_prices.filter_itineraries:main"

[tool.ruff]
line-length = 120
